# Local development infrastructure for MeetJoe.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Credentials here are for local development only and match
# src/MeetJoe.Api/appsettings.Development.json. Do not reuse them anywhere else.
name: meetjoe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meetjoe
      POSTGRES_PASSWORD: meetjoe_dev
      POSTGRES_DB: meetjoe
    ports:
      # Host port 5433 so it does not collide with a PostgreSQL already running on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetjoe -d meetjoe"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. MinIO no longer publishes its own container images, so this
  # uses Chainguard's build of the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: meetjoe
      MINIO_ROOT_PASSWORD: meetjoe_dev_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # WebRTC SFU. Signalling on 7880; media on 7881/tcp and 7882/udp.
  livekit:
    image: livekit/livekit-server:v1.13
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres-data:
  minio-data:
