# LiveKit server configuration for local development.
# The key/secret pair matches LiveKit:ApiKey / LiveKit:ApiSecret in
# src/MeetJoe.Api/appsettings.Development.json. Local development only.
port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

keys:
  meetjoe_dev: meetjoe_dev_livekit_secret_0123456789abcdef

logging:
  level: info
