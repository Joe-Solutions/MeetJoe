<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeetJoe · Meeting</title>
  <style>
    :root {
      --stage: #050D16;
      --bar: #141A22;
      --bar-hover: #1E2733;
      --tile: #1B2430;
      --tile-border: #2A3544;
      --text: #F3F6F8;
      --muted: #9AA7B5;
      --accent: #1EC8C8;
      --danger: #C43B3B;
      --danger-hover: #D94A4A;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: Manrope, "Segoe UI", system-ui, sans-serif;
      background: var(--stage); color: var(--text);
      user-select: none;
    }
    body { display: flex; flex-direction: column; }

    #toolbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 8px 16px;
      background: var(--bar);
      border-bottom: 1px solid #1C2430;
      z-index: 5;
    }
    .bar-left, .bar-right {
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .bar-right { justify-content: flex-end; }
    .bar-center {
      display: flex; align-items: flex-end; justify-content: center; gap: 4px;
      flex-wrap: wrap;
    }
    .timer {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 13px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .timer svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 1.7; }

    .ctrl {
      appearance: none; border: 0; background: transparent;
      width: 64px; padding: 6px 4px 4px; border-radius: 8px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font: inherit; font-size: 11px; font-weight: 600; color: var(--muted);
    }
    .ctrl:hover { background: var(--bar-hover); color: var(--text); }
    .ctrl .icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: grid; place-items: center;
      background: #1B2430; color: var(--text);
    }
    .ctrl:hover .icon { background: #243041; }
    .ctrl.off .icon { background: #3A4452; }
    .ctrl.off { color: var(--muted); }
    .ctrl.active .icon { background: var(--accent); color: #04262B; }
    .ctrl svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .ctrl .badge {
      position: absolute; top: 2px; right: 10px;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
      background: var(--accent); color: #04262B; font-size: 10px; font-weight: 700;
      display: grid; place-items: center;
    }
    .ctrl-wrap { position: relative; }

    .leave {
      appearance: none; border: 0; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--danger); color: #fff;
      padding: 10px 16px; border-radius: 8px;
      font: inherit; font-size: 14px; font-weight: 700;
    }
    .leave:hover { background: var(--danger-hover); }
    .leave svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }

    #banner {
      display: none; padding: 8px 16px; background: #291EC8C8; color: var(--text); font-size: 13px;
    }
    #banner.show { display: block; }

    /* —— Meet-style participant grid (card tiles, never full-bleed video) —— */
    #stage {
      position: relative; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--stage);
      padding: 16px;
    }
    html.embed #stage { min-height: 100%; height: 100%; }
    #status {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      padding: 6px 12px; border-radius: 999px;
      background: rgba(10, 22, 36, 0.72); color: var(--muted);
      font-size: 12px; font-weight: 600; pointer-events: none; z-index: 2;
    }
    #status.live { color: var(--accent); opacity: 0.85; }
    #status.error { color: #FF8A7A; opacity: 1; }

    #grid {
      flex: 1; min-height: 0;
      width: 100%;
      display: grid;
      gap: 12px;
      align-content: center;
      justify-content: center;
      justify-items: center;
      align-items: center;
      grid-template-columns: repeat(var(--cols, 1), minmax(160px, 420px));
      grid-auto-rows: auto;
      padding: 8px;
    }
    #grid[data-count="0"] {
      display: grid; place-items: center;
    }
    #grid[data-count="0"]::after {
      content: "Connecting…";
      color: var(--muted); font-size: 15px; font-weight: 600;
    }

    .tile {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 16 / 10;
      min-height: 160px;
      max-height: 420px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--tile);
      border: 1px solid var(--tile-border);
      box-shadow: 0 2px 12px rgba(0,0,0,.28);
      display: flex; align-items: center; justify-content: center;
    }
    .tile.speaking { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .tile video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      background: #0a121c;
      z-index: 0;
    }
    .tile video.hidden { display: none !important; }
    .tile-avatar {
      position: relative;
      width: min(112px, 28%);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 25%, #3A5A78, #1A3852 70%);
      font-size: clamp(22px, 4vw, 40px);
      font-weight: 700; color: var(--text);
      letter-spacing: -0.02em;
      z-index: 1;
      box-shadow: 0 0 0 0 transparent;
    }
    .tile.speaking .tile-avatar {
      animation: speak-pulse 1.1s ease-in-out infinite;
    }
    @keyframes speak-pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(30, 200, 200, 0.55), 0 0 0 3px var(--accent);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 14px rgba(30, 200, 200, 0), 0 0 0 3px var(--accent);
        transform: scale(1.04);
      }
    }
    .tile.has-video .tile-avatar { display: none; }
    .tile-name {
      position: absolute; left: 12px; bottom: 10px; z-index: 3;
      max-width: calc(100% - 48px);
      font-size: 13px; font-weight: 600;
      text-shadow: 0 1px 6px rgba(0,0,0,.85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    .tile-live {
      position: absolute; top: 10px; left: 10px; z-index: 3;
      padding: 3px 8px; border-radius: 8px;
      background: rgba(30, 200, 200, 0.18); color: var(--accent);
      font-size: 11px; font-weight: 700;
    }
    .tile-mic {
      position: absolute; top: 10px; right: 10px; z-index: 3;
      width: 28px; height: 28px; border-radius: 50%;
      display: none; place-items: center;
      background: #C43B3B;
    }
    .tile-mic.muted { display: grid; }
    .tile-mic svg {
      width: 14px; height: 14px; stroke: #FF8A7A; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }

    #roster {
      display: none; position: absolute; inset: 0; z-index: 4;
      background: rgba(5, 13, 22, 0.92); padding: 24px;
      overflow: auto;
    }
    #roster.open { display: block; }
    #roster h2 { margin: 0 0 16px; font-size: 18px; }
    #roster-list { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
    .roster-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px; background: #122033;
    }
    .roster-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center;
      background: #1A3852; font-weight: 700; font-size: 13px;
    }
  </style>
</head>
<body>
  <header id="toolbar">
    <div class="bar-left">
      <div class="timer" title="Call duration">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span id="timer">00:00</span>
      </div>
    </div>

    <div class="bar-center">
      <button class="ctrl" id="mic" type="button" title="Microphone">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>
        Mic
      </button>
      <button class="ctrl" id="cam" type="button" title="Camera">
        <span class="icon"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></span>
        Camera
      </button>
      <button class="ctrl" id="share" type="button" title="Share screen">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></span>
        Share
      </button>
      <button class="ctrl" id="chat" type="button" title="Chat" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        Chat
      </button>
      <div class="ctrl-wrap">
        <button class="ctrl" id="people" type="button" title="People">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          People
        </button>
        <span class="badge" id="people-count" hidden>0</span>
      </div>
      <button class="ctrl" id="hold" type="button" title="Hold" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></span>
        Hold
      </button>
      <button class="ctrl" id="record" type="button" title="Record" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg></span>
        Record
      </button>
      <button class="ctrl" id="more" type="button" title="More" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></span>
        More
      </button>
    </div>

    <div class="bar-right">
      <button class="leave" id="leave" type="button" title="Leave">
        <svg viewBox="0 0 24 24"><path d="M10 9l-6 3 6 3"/><path d="M4 12h12"/><path d="M15 5h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/></svg>
        Leave
      </button>
    </div>
  </header>

  <div id="banner"></div>

  <div id="stage">
    <div id="status">Connecting…</div>
    <div id="grid" data-count="0" style="--cols: 1"></div>

    <aside id="roster" aria-label="People in this call">
      <h2>People</h2>
      <div id="roster-list"></div>
    </aside>
  </div>

  <script src="livekit-client.umd.min.js"></script>
  <script>
    const LivekitClient = window.LivekitClient;
    const params = new URLSearchParams(
      location.search ? location.search.slice(1) : location.hash.replace(/^#/, ""));
    const url = params.get("u");
    const token = params.get("t");
    const embedded = params.get("embed") === "1";
    if (embedded) {
      document.documentElement.classList.add("embed");
      const toolbar = document.getElementById("toolbar");
      if (toolbar) toolbar.style.display = "none";
      // Fill the Avalonia media cell; tiles stay card-sized inside #grid.
      const stage = document.getElementById("stage");
      if (stage) {
        stage.style.flex = "1";
        stage.style.height = "100%";
      }
    }

    const statusEl = document.getElementById("status");
    const banner = document.getElementById("banner");
    const grid = document.getElementById("grid");
    const timerEl = document.getElementById("timer");
    const peopleCount = document.getElementById("people-count");
    const roster = document.getElementById("roster");
    const rosterList = document.getElementById("roster-list");

    const MIC_SVG =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>' +
      '<path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>' +
      '<line x1="8" y1="23" x2="16" y2="23"/><line x1="4" y1="4" x2="20" y2="20"/>' +
      "</svg>";

    /** @type {Map<string, { name: string, isLocal: boolean, hasVideo: boolean, muted: boolean, el: HTMLElement|null }>} */
    const people = new Map();
    let localId = null;
    let startedAt = null;
    let timerHandle = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function showBanner(text) {
      banner.textContent = text;
      banner.classList.toggle("show", Boolean(text));
    }

    function initials(name) {
      const parts = String(name || "")
        .replace(/\([^)]*\)/g, " ")
        .split(/\s+/)
        .map(p => p.trim())
        .filter(p => /[A-Za-z0-9]/.test(p));
      if (parts.length === 0) return "?";
      const first = (parts[0].match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase();
      if (parts.length === 1) return first;
      const last = (parts[parts.length - 1].match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase();
      return first + last;
    }

    function formatDuration(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function startTimer() {
      startedAt = Date.now();
      timerHandle = setInterval(() => {
        timerEl.textContent = formatDuration(Date.now() - startedAt);
      }, 1000);
    }

    function columnsFor(count) {
      if (count <= 1) return 1;
      if (count <= 2) return 2;
      if (count <= 4) return 2;
      if (count <= 9) return 3;
      return 4;
    }

    function ensureTile(id) {
      let info = people.get(id);
      if (!info) return null;
      if (info.el && info.el.isConnected) return info.el;

      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.id = id;
      tile.innerHTML =
        `<video class="hidden" playsinline autoplay muted></video>` +
        `<div class="tile-avatar">${initials(info.name)}</div>` +
        `<div class="tile-live">Live</div>` +
        `<div class="tile-name"></div>` +
        `<div class="tile-mic">${MIC_SVG}</div>`;
      info.el = tile;
      grid.appendChild(tile);
      syncTile(id);
      return tile;
    }

    function syncTile(id) {
      const info = people.get(id);
      if (!info?.el) return;
      const tile = info.el;
      const avatar = tile.querySelector(".tile-avatar");
      const nameEl = tile.querySelector(".tile-name");
      const micEl = tile.querySelector(".tile-mic");
      const video = tile.querySelector("video");
      const label = info.isLocal ? (info.name ? `${info.name} (You)` : "You") : (info.name || "Guest");
      nameEl.textContent = label;
      avatar.textContent = initials(info.name || (info.isLocal ? "You" : "?"));
      tile.classList.toggle("has-video", info.hasVideo);
      micEl.classList.toggle("muted", info.muted);
      if (video) {
        video.classList.toggle("hidden", !info.hasVideo);
        // Local preview must stay muted to avoid echo; keep it inside the tile only.
        video.muted = !!info.isLocal;
        video.playsInline = true;
        video.disablePictureInPicture = true;
        video.setAttribute("playsinline", "true");
        video.setAttribute("webkit-playsinline", "true");
      }
    }

    function layoutGrid() {
      const count = people.size;
      grid.dataset.count = String(count);
      grid.style.setProperty("--cols", String(columnsFor(count)));
      // Keep DOM order: local last (Meet-like “You” often at end), remotes first by join.
      const remotes = [...people.entries()].filter(([, p]) => !p.isLocal);
      const locals = [...people.entries()].filter(([, p]) => p.isLocal);
      for (const [id] of [...remotes, ...locals]) ensureTile(id);
    }

    function refreshPeopleUi() {
      const count = people.size;
      peopleCount.textContent = String(count);
      peopleCount.hidden = count === 0;
      rosterList.innerHTML = "";
      for (const [, p] of people) {
        const row = document.createElement("div");
        row.className = "roster-row";
        row.innerHTML =
          `<div class="roster-avatar">${initials(p.name)}</div>` +
          `<div>${p.name}${p.isLocal ? " (you)" : ""}</div>`;
        rosterList.appendChild(row);
      }
      layoutGrid();
    }

    function upsertPerson(id, name, isLocal) {
      const existing = people.get(id) || {
        name, isLocal, hasVideo: false, muted: isLocal ? false : true, el: null,
      };
      existing.name = name || existing.name;
      existing.isLocal = isLocal;
      people.set(id, existing);
      refreshPeopleUi();
    }

    function removePerson(id) {
      const info = people.get(id);
      if (info?.el) info.el.remove();
      people.delete(id);
      refreshPeopleUi();
    }

    function ensureVideo(tile, isLocal) {
      let video = tile.querySelector("video");
      if (!video) {
        video = document.createElement("video");
        video.autoplay = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "true");
        video.setAttribute("webkit-playsinline", "true");
        video.disablePictureInPicture = true;
        tile.insertBefore(video, tile.firstChild);
      }
      // Never let LiveKit create a detached/full-screen video element.
      video.muted = !!isLocal;
      video.classList.remove("hidden");
      return video;
    }

    function attachTrack(identity, name, track, isLocal) {
      upsertPerson(identity, name, isLocal);
      if (isLocal) localId = identity;

      if (track.kind === "audio" && !isLocal) {
        // Re-attach: drop any prior element for this identity.
        document.querySelectorAll("audio[data-meetjoe-audio]").forEach(el => {
          if (el.getAttribute("data-meetjoe-audio") === identity) {
            try { el.remove(); } catch (_) {}
          }
        });
        const audio = track.attach();
        audio.autoplay = true;
        audio.setAttribute("playsinline", "true");
        audio.setAttribute("data-meetjoe-audio", identity);
        audio.muted = false;
        audio.volume = 1;
        document.body.appendChild(audio);
        // WKWebView often needs an explicit play() after attach.
        const tryPlay = () => {
          const p = audio.play();
          if (p && typeof p.catch === "function") {
            p.catch(() => { ensureAudioPlayback(); });
          }
        };
        tryPlay();
        audio.addEventListener("canplay", tryPlay, { once: true });
        ensureAudioPlayback();
        const info = people.get(identity);
        if (info) {
          info.muted = !!track.isMuted;
          syncTile(identity);
        }
        refreshMuteFromRoom();
        return;
      }
      if (track.kind !== "video") return;

      const info = people.get(identity);
      if (!info) return;
      info.hasVideo = true;
      const tile = ensureTile(identity);
      if (!tile) return;
      const video = ensureVideo(tile, isLocal);
      // Attach into the tile's <video> only — never use track.attach() without an element
      // (that creates a free-floating full-screen video node).
      track.detach();
      track.attach(video);
      video.classList.remove("hidden");
      const play = video.play();
      if (play && typeof play.catch === "function") play.catch(() => {});
      syncTile(identity);
      layoutGrid();
    }

    function detachTrack(identity, track) {
      track.detach();
      if (track.kind !== "video") return;
      const info = people.get(identity);
      if (!info) return;
      info.hasVideo = false;
      const video = info.el?.querySelector("video");
      if (video) {
        video.removeAttribute("src");
        video.srcObject = null;
        video.classList.add("hidden");
      }
      syncTile(identity);
    }

    function reportMuteStates() {
      const muted = [];
      for (const [id, p] of people) {
        if (p.muted) muted.push(id);
      }
      notifyHost("mutes:" + muted.join(","));
    }

    async function publishMuteState(muted) {
      if (!activeRoom) return;
      try {
        const bytes = new TextEncoder().encode(JSON.stringify({ t: "mic", muted: !!muted }));
        await activeRoom.localParticipant.publishData(bytes, { reliable: true });
      } catch (err) {
        console.error(err);
      }
    }

    function audioPublicationsFor(participant) {
      if (!participant) return [];
      if (participant.audioTrackPublications)
        return [...participant.audioTrackPublications.values()];
      return [...participant.trackPublications.values()].filter(p => p.kind === "audio");
    }

    /** Sync mute badges from LiveKit publications, then push to the Avalonia host. */
    function refreshMuteFromRoom() {
      if (!activeRoom) return;
      for (const [id, p] of people) {
        if (p.isLocal) {
          p.muted = !activeRoom.localParticipant.isMicrophoneEnabled;
          syncTile(id);
          continue;
        }
        const remote = activeRoom.remoteParticipants.get(id);
        if (!remote) continue;
        const pubs = audioPublicationsFor(remote);
        if (pubs.length === 0) continue;
        // Only treat as muted when every audio publication is explicitly muted.
        // Do not use !pub.track — missing local attach must not mark others muted.
        p.muted = pubs.every(pub => !!pub.isMuted);
        syncTile(id);
      }
      reportMuteStates();
    }

    function notifyHost(msg) {
      try {
        if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === "function") {
          window.chrome.webview.postMessage(msg);
          return;
        }
      } catch (_) { /* Windows WebView2 */ }
      try {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.webview
            && typeof window.webkit.messageHandlers.webview.postMessage === "function") {
          window.webkit.messageHandlers.webview.postMessage(msg);
          return;
        }
      } catch (_) { /* macOS WKWebView */ }
      try {
        if (window.external && typeof window.external.sendMessage === "function") {
          window.external.sendMessage(msg);
          return;
        }
      } catch (_) { /* Avalonia/Blazor bridge */ }
      try {
        if (typeof invokeCSharpAction === "function") invokeCSharpAction(msg);
      } catch (_) { /* legacy */ }
    }
    window.meetjoeNotifyHost = notifyHost;

    // Uncover as early as possible (before LiveKit connect / getUserMedia).
    notifyHost("media-ready");

    function signalLeave() {
      notifyHost("leave");
      try { location.hash = "meetjoe-leave=" + Date.now(); } catch (_) { /* ignore */ }
    }

    /** @type {import('livekit-client').Room | null} */
    let activeRoom = null;
    let audioUnlockAttempts = 0;

    async function ensureAudioPlayback() {
      const room = activeRoom;
      if (!room) return false;
      try {
        if (typeof room.startAudio === "function") await room.startAudio();
        document.querySelectorAll("audio[data-meetjoe-audio]").forEach(audio => {
          audio.muted = false;
          audio.volume = 1;
          const p = audio.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        });
        if (room.canPlaybackAudio === false) {
          audioUnlockAttempts++;
          if (audioUnlockAttempts <= 2) {
            showBanner("Sound is blocked. Tap the mic or camera button once to enable audio.");
            notifyHost("audio-blocked");
          }
          return false;
        }
        notifyHost("audio-ok");
        return true;
      } catch (err) {
        console.error(err);
        notifyHost("audio-blocked");
        return false;
      }
    }
    window.meetjoeEnsureAudio = ensureAudioPlayback;

    async function main() {
      if (!url || !token) {
        setStatus("Missing join details. Re-open media from MeetJoe.", "error");
        return;
      }
      if (!window.isSecureContext && !/^https?:\/\/(localhost|127\.0\.0\.1)(:|$)/i.test(location.origin)) {
        showBanner("Camera and microphone need a secure context (https or localhost).");
      }

      const room = new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true,
        audioCaptureDefaults: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
        videoCaptureDefaults: {
          resolution: LivekitClient.VideoPresets.h720.resolution,
        },
        publishDefaults: {
          videoEncoding: LivekitClient.VideoPresets.h720.encoding,
          simulcast: true,
        },
      });
      activeRoom = room;

      room
        .on(LivekitClient.RoomEvent.TrackSubscribed, (track, _pub, participant) => {
          attachTrack(participant.identity, participant.name || participant.identity, track, false);
        })
        .on(LivekitClient.RoomEvent.LocalTrackPublished, (pub, participant) => {
          if (pub.track)
            attachTrack(participant.identity, participant.name || participant.identity, pub.track, true);
        })
        .on(LivekitClient.RoomEvent.LocalTrackUnpublished, (pub, participant) => {
          if (pub.track) detachTrack(participant.identity, pub.track);
          else if (pub.kind === "video") {
            const info = people.get(participant.identity);
            if (info) {
              info.hasVideo = false;
              syncTile(participant.identity);
            }
          }
        })
        .on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, _pub, participant) => {
          detachTrack(participant.identity, track);
        })
        .on(LivekitClient.RoomEvent.TrackMuted, (pub, participant) => {
          if (pub.kind !== "audio") return;
          const info = people.get(participant.identity);
          if (info) { info.muted = true; syncTile(participant.identity); }
          refreshMuteFromRoom();
        })
        .on(LivekitClient.RoomEvent.TrackUnmuted, (pub, participant) => {
          if (pub.kind !== "audio") return;
          const info = people.get(participant.identity);
          if (info) { info.muted = false; syncTile(participant.identity); }
          refreshMuteFromRoom();
        })
        .on(LivekitClient.RoomEvent.TrackPublished, (_pub, participant) => {
          if (participant?.identity) refreshMuteFromRoom();
        })
        .on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
          upsertPerson(participant.identity, participant.name || participant.identity, false);
          // Tell the newcomer our current mic state.
          publishMuteState(!room.localParticipant.isMicrophoneEnabled);
          refreshMuteFromRoom();
        })
        .on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
          removePerson(participant.identity);
          reportMuteStates();
        })
        .on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
          try {
            const msg = JSON.parse(new TextDecoder().decode(payload));
            if (msg?.t !== "mic" || !participant) return;
            const info = people.get(participant.identity);
            if (!info) {
              upsertPerson(participant.identity, participant.name || participant.identity, false);
            }
            const row = people.get(participant.identity);
            if (row) {
              row.muted = !!msg.muted;
              syncTile(participant.identity);
            }
            reportMuteStates();
          } catch (_) { /* ignore non-JSON */ }
        })
        .on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
          const ids = new Set(speakers.map(s => s.identity));
          for (const [id, p] of people) {
            p.el?.classList.toggle("speaking", ids.has(id));
          }
          notifyHost("speakers:" + [...ids].join(","));
        })
        .on(LivekitClient.RoomEvent.AudioPlaybackStatusChanged, () => {
          if (room.canPlaybackAudio) notifyHost("audio-ok");
          else {
            notifyHost("audio-blocked");
            showBanner("Sound is blocked. Tap the mic or camera button once to enable audio.");
          }
        })
        .on(LivekitClient.RoomEvent.Disconnected, () => {
          setStatus("Disconnected", "error");
          if (timerHandle) clearInterval(timerHandle);
        });

      try {
        // Ask the Avalonia host to uncover this WebView before getUserMedia.
        // Covered WKWebView on macOS fails mic/camera and plays no remote audio.
        notifyHost("media-ready");
        await new Promise(r => setTimeout(r, 450));

        await room.connect(url, token);
        const me = room.localParticipant;
        localId = me.identity;
        upsertPerson(me.identity, me.name || "You", true);
        await ensureAudioPlayback();

        const micBtn = document.getElementById("mic");
        const camBtn = document.getElementById("cam");

        try {
          await me.setMicrophoneEnabled(true);
          micBtn.classList.toggle("off", false);
          const info = people.get(me.identity);
          if (info) { info.muted = false; syncTile(me.identity); }
          notifyHost("mic-on");
          await ensureAudioPlayback();
        } catch (micErr) {
          console.error(micErr);
          micBtn.classList.toggle("off", true);
          const info = people.get(me.identity);
          if (info) { info.muted = true; syncTile(me.identity); }
          notifyHost("mic-off");
          notifyHost("permission-mic");
          showBanner("Microphone is blocked. Allow mic access for MeetJoe in System Settings, then rejoin.");
        }
        try {
          await me.setCameraEnabled(true);
          camBtn.classList.toggle("off", false);
          notifyHost("camera-on");
        } catch (camErr) {
          console.error(camErr);
          camBtn.classList.toggle("off", true);
          notifyHost("camera-off");
          notifyHost("permission-camera");
          const prior = banner.classList.contains("show") ? banner.textContent + " " : "";
          showBanner(prior + "Camera is blocked. Allow camera access for MeetJoe in System Settings.");
        }

        for (const pub of me.trackPublications.values()) {
          if (pub.track) attachTrack(me.identity, me.name || "You", pub.track, true);
        }
        for (const participant of room.remoteParticipants.values()) {
          upsertPerson(participant.identity, participant.name || participant.identity, false);
          for (const pub of participant.trackPublications.values()) {
            if (pub.track)
              attachTrack(participant.identity, participant.name || participant.identity, pub.track, false);
            else if (pub.kind === "audio" || pub.kind === "video") {
              try { await pub.setSubscribed(true); } catch (_) { /* older clients */ }
            }
          }
        }
        await ensureAudioPlayback();
        refreshMuteFromRoom();
        await publishMuteState(!room.localParticipant.isMicrophoneEnabled);
        setStatus("Live", "live");
        startTimer();
        // Keep Avalonia mute badges in sync even if a TrackMuted event is missed.
        setInterval(() => { try { refreshMuteFromRoom(); } catch (_) {} }, 2000);
      } catch (err) {
        console.error(err);
        setStatus(err?.message || "Could not connect", "error");
        showBanner("Check that LiveKit is running and that this page was opened from MeetJoe.");
        return;
      }

      const micBtn = document.getElementById("mic");
      const camBtn = document.getElementById("cam");
      const shareBtn = document.getElementById("share");
      const peopleBtn = document.getElementById("people");
      const leaveBtn = document.getElementById("leave");

      function reportMediaState() {
        const camOn = !!room.localParticipant.isCameraEnabled;
        const micOn = !!room.localParticipant.isMicrophoneEnabled;
        camBtn.classList.toggle("off", !camOn);
        micBtn.classList.toggle("off", !micOn);
        notifyHost(camOn ? "camera-on" : "camera-off");
        notifyHost(micOn ? "mic-on" : "mic-off");
      }

      async function setCameraEnabled(on) {
        try {
          await room.localParticipant.setCameraEnabled(on);
        } catch (err) {
          console.error(err);
          notifyHost("permission-camera");
          throw err;
        }
        if (!on) {
          const info = people.get(localId);
          if (info) {
            info.hasVideo = false;
            const video = info.el?.querySelector("video");
            if (video) {
              video.srcObject = null;
              video.classList.add("hidden");
            }
            syncTile(localId);
          }
        }
        reportMediaState();
        return !!room.localParticipant.isCameraEnabled;
      }

      async function setMicEnabled(on) {
        try {
          await room.localParticipant.setMicrophoneEnabled(on);
        } catch (err) {
          console.error(err);
          notifyHost("permission-mic");
          throw err;
        }
        const info = people.get(localId);
        if (info) { info.muted = !on; syncTile(localId); }
        reportMediaState();
        await publishMuteState(!on);
        refreshMuteFromRoom();
        return !!room.localParticipant.isMicrophoneEnabled;
      }

      window.meetjoeToggleCamera = async () => {
        const wantOn = !room.localParticipant.isCameraEnabled;
        try {
          await ensureAudioPlayback();
          const on = await setCameraEnabled(wantOn);
          if (wantOn && !on) notifyHost("permission-camera");
          return on;
        } catch (err) {
          console.error(err);
          notifyHost("permission-camera");
          showBanner("Could not toggle camera. Allow camera access for MeetJoe in System Settings.");
          reportMediaState();
          return false;
        }
      };
      window.meetjoeToggleMic = async () => {
        const wantOn = !room.localParticipant.isMicrophoneEnabled;
        try {
          await ensureAudioPlayback();
          const on = await setMicEnabled(wantOn);
          if (wantOn && !on) notifyHost("permission-mic");
          return on;
        } catch (err) {
          console.error(err);
          notifyHost("permission-mic");
          showBanner("Could not toggle microphone. Allow mic access for MeetJoe in System Settings.");
          reportMediaState();
          return false;
        }
      };
      window.meetjoeMediaState = () => ({
        camera: !!room.localParticipant.isCameraEnabled,
        mic: !!room.localParticipant.isMicrophoneEnabled,
      });

      micBtn.onclick = async () => { await window.meetjoeToggleMic(); };
      camBtn.onclick = async () => { await window.meetjoeToggleCamera(); };
      reportMediaState();
      shareBtn.onclick = async () => {
        const sharing = room.localParticipant.isScreenShareEnabled;
        await room.localParticipant.setScreenShareEnabled(!sharing);
        shareBtn.classList.toggle("active", !sharing);
      };
      peopleBtn.onclick = () => {
        roster.classList.toggle("open");
        peopleBtn.classList.toggle("active", roster.classList.contains("open"));
      };
      leaveBtn.onclick = async () => {
        await window.meetjoeShutdown?.();
        setStatus("You left. Close this view from MeetJoe.", "error");
        signalLeave();
      };

      /** Stop tracks + disconnect so the host can tear down WKWebView without a native crash. */
      window.meetjoeShutdown = async () => {
        try {
          await room.localParticipant.setCameraEnabled(false);
        } catch (_) { /* ignore */ }
        try {
          await room.localParticipant.setMicrophoneEnabled(false);
        } catch (_) { /* ignore */ }
        try {
          await room.localParticipant.setScreenShareEnabled(false);
        } catch (_) { /* ignore */ }
        try {
          document.querySelectorAll("video,audio").forEach(el => {
            try {
              const stream = el.srcObject;
              if (stream && stream.getTracks) stream.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
              el.srcObject = null;
              el.removeAttribute("src");
            } catch (_) { /* ignore */ }
          });
        } catch (_) { /* ignore */ }
        try { await room.disconnect(); } catch (_) { /* ignore */ }
        if (timerHandle) {
          clearInterval(timerHandle);
          timerHandle = null;
        }
        activeRoom = null;
      };

      window.addEventListener("beforeunload", () => {
        try { room.disconnect(); } catch (_) { /* ignore */ }
      });
    }

    main();
  </script>
</body>
</html>
